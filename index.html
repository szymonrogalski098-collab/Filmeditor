<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PFP Studio - świecący kot low-poly</title>
<style>
:root{
  --bg:#080c0a; --panel:#0f1511; --panel2:#141c17; --line:#1e2b23; --text:#d6eedd; --dim:#7f9a88;
  --accent:#00ff40; --accent2:#00c832; --danger:#ff5a5a; --r:8px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}
#top{display:flex;align-items:center;gap:10px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;min-height:46px}
.brand{font-weight:700;letter-spacing:.04em;color:var(--accent);display:flex;align-items:center;gap:8px;margin-right:6px}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent),0 0 22px var(--accent)}
.grp{display:flex;align-items:center;gap:6px}
.grp.right{margin-left:auto}
button,select,input[type=text]{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:6px 10px}
button{cursor:pointer;transition:background .12s,border-color .12s,box-shadow .12s}
button:hover:not(:disabled){border-color:var(--accent2);background:#18241d}
button:active:not(:disabled){background:#1d2d24}
button:disabled{opacity:.4;cursor:default}
button.accent{background:var(--accent);color:#03130a;border-color:var(--accent);font-weight:700}
button.accent:hover:not(:disabled){background:#4dff74;box-shadow:0 0 14px rgba(0,255,64,.5)}
button.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent)}
button.danger:hover:not(:disabled){border-color:var(--danger);color:var(--danger)}
button.sm{padding:3px 7px;font-size:12px}
#zoomLbl{min-width:46px;text-align:center;color:var(--dim)}
#main{flex:1;display:flex;min-height:0}
#viewport{flex:1;position:relative;min-width:0;background:#050806;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;outline:none}
#hint{position:absolute;left:10px;bottom:8px;color:var(--dim);font-size:11px;pointer-events:none;text-shadow:0 1px 2px #000}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#0f1f15;border:1px solid var(--accent2);color:var(--text);padding:7px 14px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:80%;text-align:center}
#toast.show{opacity:1}
#panel{width:350px;max-width:100%;overflow-y:auto;background:var(--panel);border-left:1px solid var(--line)}
details{border-bottom:1px solid var(--line)}
summary{cursor:pointer;padding:10px 12px;font-weight:600;color:var(--accent);list-style:none;user-select:none;display:flex;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary::before{content:"";width:6px;height:6px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(-45deg);transition:transform .15s}
details[open]>summary::before{transform:rotate(45deg)}
.body{padding:4px 12px 14px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:8px;min-height:26px}
.row .lbl{flex:0 0 112px;color:var(--dim)}
.row input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.row input[type=color]{width:46px;height:26px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
.row select,.row input[type=text]{flex:1;min-width:0}
.row .val{flex:0 0 44px;text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}
.row input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.sub{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-top:4px}
.note{color:var(--dim);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grid.g3{grid-template-columns:repeat(3,1fr)}
.pose{padding:4px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px}
.pose canvas{width:56px;height:56px;border-radius:6px;background:#0a110d}
.layer{display:flex;align-items:center;gap:6px;padding:4px 6px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel2);cursor:pointer}
.layer.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.layer .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layer .tg{font-size:10px;color:var(--dim);text-transform:uppercase}
.layer.child{margin-left:16px}
.saved{display:flex;align-items:center;gap:6px;padding:3px 6px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer}
.saved .nm{flex:1}
.dims{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:600}
@media (max-width:820px){
  #main{flex-direction:column}
  #panel{width:100%;height:44vh;border-left:0;border-top:1px solid var(--line)}
  #hint{display:none}
  .brand{display:none}
}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand"><span class="dot"></span>PFP STUDIO</div>
    <div class="grp">
      <button id="bUndo" title="Cofnij (Ctrl+Z)">Cofnij</button>
      <button id="bRedo" title="Ponów (Ctrl+Shift+Z)">Ponów</button>
    </div>
    <div class="grp">
      <button id="bZoomOut" title="Oddal">-</button>
      <span id="zoomLbl">100%</span>
      <button id="bZoomIn" title="Przybliż">+</button>
      <button id="bFit" title="Dopasuj widok do obszaru eksportu (0)">Dopasuj</button>
    </div>
    <div class="grp right">
      <button id="bNew">Nowa scena</button>
      <button id="bArea">Wybierz obszar</button>
      <button id="bExportTop" class="accent">Eksportuj PNG</button>
    </div>
  </header>
  <div id="main">
    <div id="viewport">
      <canvas id="cv" tabindex="0"></canvas>
      <div id="toast"></div>
      <div id="hint">Kółko: zoom &middot; Spacja/środkowy przycisk + przeciąganie: przesuń &middot; Delete: usuń &middot; Ctrl+D: duplikuj</div>
    </div>
    <aside id="panel"></aside>
  </div>
</div>
<script>
'use strict';
(() => {

/* =====================================================================
   UTIL / MATRIX / COLOR
   ===================================================================== */
const D2R = Math.PI / 180, R2D = 180 / Math.PI;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeInOut = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const clone = o => JSON.parse(JSON.stringify(o));
const $ = id => document.getElementById(id);

function makeRng(seed) {
  let s = (seed | 0) || 1;
  return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return ((s >>> 0) % 1000003) / 1000003; };
}

// macierz afiniczna [a,b,c,d,e,f] (konwencja Canvas): x' = a x + c y + e
const MI = [1, 0, 0, 1, 0, 0];
const mMul = (m, n) => [
  m[0] * n[0] + m[2] * n[1], m[1] * n[0] + m[3] * n[1],
  m[0] * n[2] + m[2] * n[3], m[1] * n[2] + m[3] * n[3],
  m[0] * n[4] + m[2] * n[5] + m[4], m[1] * n[4] + m[3] * n[5] + m[5]];
const mDet = m => m[0] * m[3] - m[1] * m[2];
function mInv(m) {
  const d = mDet(m), a = m[3] / d, b = -m[1] / d, c = -m[2] / d, e = m[0] / d;
  return [a, b, c, e, -(a * m[4] + c * m[5]), -(b * m[4] + e * m[5])];
}
const mPt = (m, x, y) => [m[0] * x + m[2] * y + m[4], m[1] * x + m[3] * y + m[5]];
const mT = (x, y) => [1, 0, 0, 1, x, y];
const mR = a => { const c = Math.cos(a), s = Math.sin(a); return [c, s, -s, c, 0, 0]; };
const mS = (sx, sy = sx) => [sx, 0, 0, sy, 0, 0];
const mScaleOf = m => Math.hypot(m[0], m[1]);

function hex2rgb(h) {
  h = String(h).replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16) || 0;
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
const mixRgb = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const rgbCss = (c, a) => a === undefined || a >= 1
  ? `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})` : `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const hexAlpha = (hex, a) => rgbCss(hex2rgb(hex), a);

// flat shading: s w [-1,1] -> jaśniej / ciemniej względem koloru bazowego
const shadeCache = new Map();
function shadeCss(rgb, s) {
  const q = Math.round(clamp(s, -1, 1) * 24);
  const key = (rgb[0] | 0) + ',' + (rgb[1] | 0) + ',' + (rgb[2] | 0) + ',' + q;
  let v = shadeCache.get(key);
  if (!v) {
    const t = q / 24;
    const c = t >= 0 ? mixRgb(rgb, [255, 255, 255], t * 0.34) : mixRgb(rgb, [rgb[0] * 0.3, rgb[1] * 0.42, rgb[2] * 0.36], -t * 0.9);
    v = rgbCss(c);
    if (shadeCache.size > 4000) shadeCache.clear();
    shadeCache.set(key, v);
  }
  return v;
}

/* =====================================================================
   SHAPES: generator low-poly (wielokąt -> trójkąty z flat shadingiem)
   ===================================================================== */
const LIGHT = (() => { const v = [-0.45, -0.62, 0.64], l = Math.hypot(...v); return v.map(x => x / l); })();

function centroidOf(pts) {
  let x = 0, y = 0; const n = pts.length / 2;
  for (let i = 0; i < pts.length; i += 2) { x += pts[i]; y += pts[i + 1]; }
  return [x / n, y / n];
}

function triShade(tri, c, R, rnd) {
  const gx = (tri[0] + tri[2] + tri[4]) / 3, gy = (tri[1] + tri[3] + tri[5]) / 3;
  let nx = (gx - c[0]) / R, ny = (gy - c[1]) / R;
  const r2 = Math.min(1, nx * nx + ny * ny), nz = Math.sqrt(1 - r2 * 0.75);
  const len = Math.hypot(nx, ny, nz) || 1;
  const d = (nx * LIGHT[0] + ny * LIGHT[1] + nz * LIGHT[2]) / len;
  return clamp((d - 0.52) * 1.7 + (rnd() - 0.5) * 0.2, -1, 1);
}

// detail: 1 = wachlarz od środka, 2 = pierścień wewnętrzny + wachlarz
function lowpoly(outline, opt = {}) {
  const n = outline.length / 2, rnd = makeRng((opt.seed || 1) * 977 + n);
  const c = centroidOf(outline);
  let R = 1;
  for (let i = 0; i < n; i++) R = Math.max(R, Math.hypot(outline[2 * i] - c[0], outline[2 * i + 1] - c[1]));
  const detail = opt.detail || (n >= 6 ? 2 : 1);
  const faces = [];
  const push = (a, b, d) => { const t = [a[0], a[1], b[0], b[1], d[0], d[1]]; faces.push({ p: t, s: triShade(t, c, R, rnd) }); };
  const O = i => [outline[2 * (i % n)], outline[2 * (i % n) + 1]];
  if (detail === 1) {
    for (let i = 0; i < n; i++) push(O(i), O(i + 1), c);
    return faces;
  }
  const k = opt.ring ?? 0.5, inner = [];
  for (let i = 0; i < n; i++) {
    const o = O(i), j = (rnd() - 0.5) * 0.28 * R * k;
    inner.push([lerp(c[0], o[0], k) + j, lerp(c[1], o[1], k) + (rnd() - 0.5) * 0.28 * R * k]);
  }
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n;
    push(O(i), O(j), inner[j]);
    push(O(i), inner[j], inner[i]);
    push(inner[i], inner[j], c);
  }
  return faces;
}

// pas czworokątów pomiędzy dwiema krawędziami (opaski, szaliki)
function stripFaces(top, bot) {
  const n = top.length / 2, faces = [], rnd = makeRng(top.length * 31 + 7);
  for (let i = 0; i < n - 1; i++) {
    const a = [top[2 * i], top[2 * i + 1]], b = [top[2 * i + 2], top[2 * i + 3]];
    const c = [bot[2 * i + 2], bot[2 * i + 3]], d = [bot[2 * i], bot[2 * i + 1]];
    const base = 0.35 - 0.7 * (i / Math.max(1, n - 2));
    faces.push({ p: [a[0], a[1], b[0], b[1], c[0], c[1]], s: base + (rnd() - 0.5) * 0.25 });
    faces.push({ p: [a[0], a[1], c[0], c[1], d[0], d[1]], s: base - 0.12 + (rnd() - 0.5) * 0.25 });
  }
  return faces;
}

function limb(j, t, w0, w1) {
  const dx = t[0] - j[0], dy = t[1] - j[1], len = Math.hypot(dx, dy) || 1;
  const d = [dx / len, dy / len], nrm = [-d[1], d[0]], wm = (w0 + w1) / 2 * 1.06;
  const m = [(j[0] + t[0]) / 2, (j[1] + t[1]) / 2];
  const P = (b, u, w) => [b[0] + nrm[0] * w * u, b[1] + nrm[1] * w * u];
  const pts = [P(j, 1, w0), P(m, 1, wm), P(t, 1, w1),
    [t[0] + d[0] * w1 * 0.95, t[1] + d[1] * w1 * 0.95],
    P(t, -1, w1), P(m, -1, wm), P(j, -1, w0),
    [j[0] - d[0] * w0 * 0.95, j[1] - d[1] * w0 * 0.95]];
  return pts.flat();
}
function ellipse(cx, cy, rx, ry, n = 12, rot = 0) {
  const out = [], cr = Math.cos(rot), sr = Math.sin(rot);
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2, x = Math.cos(a) * rx, y = Math.sin(a) * ry;
    out.push(cx + x * cr - y * sr, cy + x * sr + y * cr);
  }
  return out;
}
const circ = (cx, cy, r, n = 12) => ellipse(cx, cy, r, r, n);
const flipX = (pts, cx2 = 0) => { const o = pts.slice(); for (let i = 0; i < o.length; i += 2) o[i] = cx2 - o[i]; return o; };

/* Zestawy kształtów (pojazdy, akcesoria): definicje -> elementy do rysowania */
function buildItems(defs) {
  const items = []; let seed = 1;
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  const grow = (pts, pad = 0) => {
    for (let i = 0; i < pts.length; i += 2) {
      x0 = Math.min(x0, pts[i] - pad); x1 = Math.max(x1, pts[i] + pad);
      y0 = Math.min(y0, pts[i + 1] - pad); y1 = Math.max(y1, pts[i + 1] + pad);
    }
  };
  for (const d of defs) {
    if (d.t === 'poly') {
      items.push({ tone: d.tone || 'body', faces: lowpoly(d.pts, { detail: d.detail, seed: seed++ }) });
      grow(d.pts);
    } else if (d.t === 'strip') {
      items.push({ tone: d.tone || 'body', faces: stripFaces(d.top, d.bot) });
      grow(d.top); grow(d.bot);
    } else if (d.t === 'line') {
      items.push({ tone: d.tone || 'dark', line: d.pts, w: d.w || 3, closed: !!d.closed, fillTone: d.fillTone, fillAlpha: d.fillAlpha });
      grow(d.pts, (d.w || 3) / 2);
    }
  }
  return { items, bounds: [x0, y0, x1, y1] };
}

function makePalette(hex) {
  const c = hex2rgb(hex);
  return {
    body: c, shade: mixRgb(c, [0, 0, 0], 0.42), light: mixRgb(c, [255, 255, 255], 0.5),
    inner: mixRgb(c, [10, 80, 40], 0.5), face: mixRgb(c, [0, 38, 14], 0.9),
    dark: [22, 26, 28], glassD: [22, 52, 62], glass: [150, 215, 230], metal: [156, 166, 172],
    lamp: [255, 245, 170], red: [255, 70, 70], gold: [255, 210, 74]
  };
}

function drawFaces(ctx, faces, rgb, lw) {
  ctx.lineJoin = 'round'; ctx.lineWidth = lw;
  for (const f of faces) {
    const col = shadeCss(rgb, f.s), p = f.p;
    ctx.fillStyle = col; ctx.strokeStyle = col;
    ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(p[2], p[3]); ctx.lineTo(p[4], p[5]); ctx.closePath();
    ctx.fill(); ctx.stroke();
  }
}
function tracePts(ctx, pts, closed) {
  ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  if (closed) ctx.closePath();
}
function drawItem(ctx, item, pal) {
  const t = ctx.getTransform(), px = 1 / (Math.hypot(t.a, t.b) || 1);
  if (item.faces) { drawFaces(ctx, item.faces, pal[item.tone] || pal.body, 0.9 * px); return; }
  if (item.fillTone) {
    tracePts(ctx, item.line, true);
    ctx.fillStyle = rgbCss(pal[item.fillTone], item.fillAlpha ?? 1); ctx.fill();
  }
  tracePts(ctx, item.line, item.closed);
  ctx.strokeStyle = rgbCss(pal[item.tone] || pal.dark); ctx.lineWidth = item.w;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
}

/* =====================================================================
   RIG: kości, FK, wielokąty kota
   ===================================================================== */
const HM = mMul(mT(-8, -298), mR(-0.13));          // układ głowy (lekko przechylona)
const H = (x, y) => mPt(HM, x, y);
const Hs = arr => { const o = []; for (let i = 0; i < arr.length; i += 2) o.push(...H(arr[i], arr[i + 1])); return o; };
const mirrorPt = p => [10 - p[0], p[1]];

// [nazwa, rodzic, staw (poza spoczynkowa), koniec, limit min, limit max]
const BONE_DEFS = (() => {
  const d = [
    ['root', null, [10, -100], [10, -112], -180, 180],
    ['torso', 'root', [10, -100], [-5, -228], -70, 70],
    ['neck', 'torso', [-5, -226], [-8, -262], -45, 45],
    ['head', 'neck', [-8, -262], [-8, -298], -60, 60],
    ['earL', 'head', H(-36, -34), H(-52, -84), -45, 45],
    ['earR', 'head', H(36, -36), H(54, -102), -45, 45],
    ['tail1', 'root', [-46, -48], [-112, -52], -130, 130],
    ['tail2', 'tail1', [-112, -52], [-158, -20], -120, 120],
    ['tail3', 'tail2', [-158, -20], [-132, 10], -120, 120]
  ];
  for (const s of ['L', 'R']) {
    const M = s === 'R' ? mirrorPt : (p => p);
    d.push([`frontLeg${s}_upper`, 'torso', M([-32, -196]), M([-32, -126]), -110, 110]);
    d.push([`frontLeg${s}_lower`, `frontLeg${s}_upper`, M([-32, -126]), M([-32, -48]), -135, 135]);
    d.push([`frontLeg${s}_paw`, `frontLeg${s}_lower`, M([-32, -48]), M([-30, -2]), -80, 80]);
    d.push([`hindLeg${s}_upper`, 'root', M([-55, -110]), M([-84, -48]), -120, 120]);
    d.push([`hindLeg${s}_lower`, `hindLeg${s}_upper`, M([-84, -48]), M([-62, -14]), -135, 135]);
    d.push([`hindLeg${s}_paw`, `hindLeg${s}_lower`, M([-62, -14]), M([-28, -6]), -80, 80]);
  }
  return d;
})();

const BONE = {}, BONE_LIST = [];
for (const [name, parent, j, t, lo, hi] of BONE_DEFS) {
  const ra = Math.atan2(t[1] - j[1], t[0] - j[0]);
  const rest = mMul(mT(j[0], j[1]), mR(ra));
  const b = { name, parent, j, t, lo, hi, ra, len: Math.hypot(t[0] - j[0], t[1] - j[1]), rest, restInv: mInv(rest) };
  b.L = parent ? mMul(BONE[parent].restInv, rest) : rest;
  BONE[name] = b; BONE_LIST.push(b);
}
const BONE_NAMES = BONE_LIST.map(b => b.name);

const IK_CHAINS = {
  frontLegL_paw: ['frontLegL_upper', 'frontLegL_lower', 'frontLegL_paw'],
  frontLegR_paw: ['frontLegR_upper', 'frontLegR_lower', 'frontLegR_paw'],
  hindLegL_paw: ['hindLegL_upper', 'hindLegL_lower', 'hindLegL_paw'],
  hindLegR_paw: ['hindLegR_upper', 'hindLegR_lower', 'hindLegR_paw'],
  tail3: ['tail1', 'tail2', 'tail3']
};

// wielokąty w układzie spoczynkowym kota, kolejność = z-order
const CAT_PARTS = (() => {
  const parts = []; let n = 0;
  const add = (bone, pts, tone, detail) => parts.push({ bone, pts, tone: tone || 'body', detail, seed: ++n });
  const addLine = (bone, pts, w, tone) => parts.push({ bone, line: pts, w, tone: tone || 'face' });
  const mp = pts => { const o = []; for (let i = 0; i < pts.length; i += 2) o.push(10 - pts[i], pts[i + 1]); return o; };

const CAT_ITEMS = CAT_PARTS.map(p => {
  const inv = BONE[p.bone].restInv;
  if (p.line) {
    const l = []; for (let i = 0; i < p.line.length; i += 2) l.push(...mPt(inv, p.line[i], p.line[i + 1]));
    return { bone: p.bone, tone: p.tone, line: l, w: p.w };
  }
  const faces = lowpoly(p.pts, { detail: p.detail, seed: p.seed }).map(f => {
    const q = [];
    for (let i = 0; i < 6; i += 2) q.push(...mPt(inv, f.p[i], f.p[i + 1]));
    return { p: q, s: f.s };
  });
  return { bone: p.bone, tone: p.tone, faces };
});

/* Ewaluacja pozy: macierze światowe kości (w układzie kota) */
function evalPose(pose) {
  const W = {};
  for (const b of BONE_LIST) {
    const rot = mR((pose.a[b.name] || 0) * D2R);
    W[b.name] = b.parent
      ? mMul(W[b.parent], mMul(b.L, rot))
      : mMul(mT(pose.rx || 0, pose.ry || 0), mMul(b.L, rot));
  }
  return W;
}
function poseBounds(W) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const it of CAT_ITEMS) {
    const m = W[it.bone];
    if (it.faces) {
      for (const f of it.faces) for (let i = 0; i < 6; i += 2) {
        const p = mPt(m, f.p[i], f.p[i + 1]);
        if (p[0] < x0) x0 = p[0]; if (p[0] > x1) x1 = p[0];
        if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1];
      }
    }
  }
  return [x0, y0, x1, y1];
}
const poseKey = p => (p.rx || 0) + ',' + (p.ry || 0) + ',' + BONE_NAMES.map(n => (p.a[n] || 0).toFixed(2)).join(',');
function evalCat(L) {
  const key = poseKey(L.pose);
  if (L._ev && L._ev.key === key) return L._ev;
  const W = evalPose(L.pose);
  return (L._ev = { key, W, bounds: poseBounds(W) });
}
const boneTip = (W, name) => mPt(W[name], BONE[name].len, 0);
const boneJoint = (W, name) => mPt(W[name], 0, 0);

/* =====================================================================
   POSES: absolutne kąty -> delty względem rodzica; interpolacja
   ===================================================================== */
const emptyPose = () => ({ rx: 0, ry: 0, a: {} });
function poseFromAbs(abs, rx = 0, ry = 0) {
  const A = {}, a = {};
  for (const b of BONE_LIST) {
    const par = b.parent ? BONE[b.parent] : null;
    const base = par ? A[par.name] + (b.ra - par.ra) * R2D : b.ra * R2D;
    const target = abs[b.name];
    const delta = target === undefined ? 0 : target - base;
    A[b.name] = base + delta;
    if (Math.abs(delta) > 1e-6) a[b.name] = Math.round(delta * 10) / 10;
  }
  return { rx, ry, a };
}

function lerpPose(p, q, t) {
  const out = { rx: lerp(p.rx || 0, q.rx || 0, t), ry: lerp(p.ry || 0, q.ry || 0, t), a: {} };
  for (const n of BONE_NAMES) {
    const v = lerp(p.a[n] || 0, q.a[n] || 0, t);
    if (Math.abs(v) > 1e-4) out.a[n] = v;
  }
  return out;
}

const STAGE = { x: -800, y: -800, w: 1600, h: 1600 };
const images = {};            // id -> { data, img }

function makeAsphaltTile(seed) {
  const S = 512, c = document.createElement('canvas'); c.width = c.height = S;
  const x = c.getContext('2d'), img = x.createImageData(S, S), d = img.data, r = makeRng(seed * 7919 + 13);
  const G = 24, low = new Float32Array(G * G);
  for (let i = 0; i < low.length; i++) low[i] = r() * 2 - 1;

    const gx = px / S * G, gy = py / S * G, ix = Math.floor(gx), iy = Math.floor(gy);
    let fx = gx - ix, fy = gy - iy; fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
    const a = low[(iy % G) * G + ix % G], b = low[(iy % G) * G + (ix + 1) % G];

    const u = r();
    if (u < 0.012) v += 30 + r() * 42; else if (u < 0.02) v -= 16;

  }

}
function asphaltTile(seed) {

}

  const r = STAGE.w / 2 * (Math.abs(Math.cos(a)) + Math.abs(Math.sin(a)));

}

/* =====================================================================

   ===================================================================== */
function applyPose(L, target, animate = true) {

    const L = findLayer(id);

    const t = clamp((now - a.t0) / 300, 0, 1);
    L.pose = lerpPose(a.from, a.to, easeInOut(t));

}

    return [from[0] + (to[0] - from[0]) / d * len, from[1] + (to[1] - from[1]) / d * len];

      const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const id = 'img' + Date.now();
      registerImage(id, c.toDataURL(file.type === 'image/png' ? 'image/png' : 'image/jpeg', 0.9));
      state.scene.bg.imageId = id; state.scene.bg.mode = 'image';
      commit(); UI.rebuild(); requestRender();
    };
    img.onerror = () => toast('Nie udało się wczytać obrazu');
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

/* =====================================================================
   INIT
   ===================================================================== */
function resetScene() {
  state.scene = defaultScene(); state.sel = null; state.lastCatId = state.scene.layers[0].id; anims.clear();
  state.exp = { x: -330, y: -330, w: 660, h: 660 }; state.ui.ratio = '1:1';
  hist.stack = []; hist.idx = -1; commit();
  UI.rebuild(); fitView(state.exp); select(state.lastCatId);
}
function wireTopBar() {
  $('bUndo').onclick = undo; $('bRedo').onclick = redo;
  $('bZoomIn').onclick = () => zoomAt(cv.clientWidth / 2, cv.clientHeight / 2, view.z * 1.25);
  $('bZoomOut').onclick = () => zoomAt(cv.clientWidth / 2, cv.clientHeight / 2, view.z / 1.25);
  $('bFit').onclick = () => fitView(state.exp);
  $('bArea').onclick = () => setAreaMode(!state.areaMode);
  $('bExportTop').onclick = exportPNG;
  $('bNew').onclick = () => { if (confirm('Rozpocząć nową scenę? Bieżąca scena zostanie usunięta.')) resetScene(); };
}
function init() {
  const restored = loadSaved();
  if (!restored) state.scene = defaultScene();
  state.scene.counters = state.scene.counters || {};
  const firstCat = state.scene.layers.find(l => l.type === 'cat');
  state.lastCatId = firstCat ? firstCat.id : null;
  state.sel = state.lastCatId;
  wireTopBar(); UI.init(); resize();
  new ResizeObserver(resize).observe(cv);
  commit();
  if (!restored) fitView(state.exp);
  window.__pfp = { state, view, hist, jointHandles, selLayer, outputSize, evalCat, boneTip, layerMatrix, w2s }; // diagnostyka
}
init();

})();
</script>
